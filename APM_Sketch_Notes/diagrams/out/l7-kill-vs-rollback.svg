 direction="ltr" dominant-baseline="alphabetic">the old one was fine</text></g><g stroke-opacity="0.4" fill-opacity="0.4" stroke-linecap="round" transform="translate(30 336) rotate(0 460 42)"><path d="M21 0 C272.29 5.9, 523.72 3.79, 899 0 C911.63 0.58, 920.33 4.64, 920 21 C923.09 32.01, 921.7 41.77, 920 63 C916.65 74.43, 909.72 86.22, 899 84 C703.6 79.29, 507.85 78.2, 21 84 C8.23 87.5, 3.21 78.8, 0 63 C0.5 43.18, -0.04 28.71, 0 21 C1.43 7.16, 10.23 1.46, 21 0" stroke="none" stroke-width="0" fill="#c3fae8"></path><path d="M21 0 C216.64 1.91, 412.85 1.52, 899 0 M21 0 C239.92 -1.79, 458.18 -1.23, 899 0 M899 0 C911.47 0.85, 918.77 8.11, 920 21 M899 0 C913.36 -0.77, 918.65 7.73, 920 21 M920 21 C918.58 37.66, 920.85 53.02, 920 63 M920 21 C921.21 36.56, 920.31 50.5, 920 63 M920 63 C918.59 75.87, 913.92 83.27, 899 84 M920 63 C918.74 78.64, 914.96 82.64, 899 84 M899 84 C647.43 84.71, 394.75 84.95, 21 84 M899 84 C717.66 84.38, 537.04 83.88, 21 84 M21 84 C6.25 83.99, 1.03 77.94, 0 63 M21 84 C7.59 85.98, -0.64 75.9, 0 63 M0 63 C-2.03 52.74, -1.35 44.49, 0 21 M0 63 C0.53 47.21, 0.61 29.88, 0 21 M0 21 C0.47 7.74, 6.15 1.9, 21 0 M0 21 C-0.44 5.71, 6.22 -1.73, 21 0" stroke="#0c8599" stroke-width="2" fill="none"></path></g><g transform="translate(271.58514404296875 359.25) rotate(0 218.41485595703125 18.75)"><text x="218.41485595703125" y="13.215" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">version all four, so each one can roll back on its own:</text><text x="218.41485595703125" y="31.965" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">the model, the prompt, the retrieval index, the data pipeline</text></g><g stroke-opacity="0.6" fill-opacity="0.6" stroke-linecap="round" transform="translate(30 434) rotate(0 460 20)"><path d=