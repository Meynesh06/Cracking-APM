<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" width="960" height="528"><!-- svg-source:excalidraw --><metadata></metadata><defs><style class="style-fonts">
      @font-face { font-family: Excalifont; src: url(data:font/woff2;base64,); }</style></defs><g transform="translate(10 10) rotate(0 245.24380493164062 15)"><text x="0" y="21.144" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="24px" fill="#7048e8" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Kill switch vs rollback: two different tools</text></g><g transform="translate(10 44) rotate(0 252.52626037597656 10.625)"><text x="0" y="14.977" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="17px" fill="#868e96" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">the kill switch stops the AI path; rollback swaps the version</text></g><g stroke-opacity="0.35" fill-opacity="0.35" stroke-linecap="round" transform="translate(30 106) rotate(0 230 105)"><path d="M32 0 C136.33 -1.08, 242.68 1.78, 428 0 C449.47 -3.13, 458.63 11.25, 460 32 C460.82 77.94, 460.84 123.84, 460 178 C461.17 201.22, 445.98 207.43, 428 210 C346.18 204.83, 261.82 208.75, 32 210 C7.35 210.67, 1.23 202.83, 0 178 C-4.82 121.61, -1.55 60.85, 0 32 C-0.77 8.95, 12.1 0.16, 32 0" stroke="none" stroke-width="0" fill="#ffc9c9"></path><path d="M32 0 C183.88 1.24, 336.24 2.26, 428 0 M32 0 C138.52 1.4, 245.8 0.68, 428 0 M428 0 C448.79 1.13, 458.47 11.52, 460 32 M428 0 C447.92 1.28, 460.36 9.9, 460 32 M460 32 C460.16 68.3, 459.11 102.55, 460 178 M460 32 C460.12 81.96, 460.03 133.49, 460 178 M460 178 C459.85 198.41, 447.92 208.87, 428 210 M460 178 C461.06 198.49, 448.07 211.64, 428 210 M428 210 C274.86 210.18, 123.9 208.68, 32 210 M428 210 C285.91 207.88, 143.71 208.34, 32 210 M32 210 C10.58 209.12, -0.75 199.33, 0 178 M32 210 C11.85 211.08, 0.59 201.31, 0 178 M0 178 C1.12 138.17, -1.25 97.07, 0 32 M0 178 C1.51 143.64, 1.52 109.21, 0 32 M0 32 C1.97 8.83, 11.13 0.74, 32 0 M0 32 C-0.98 12.85, 10.23 -1.29, 32 0" stroke="#e03131" stroke-width="2" fill="none"></path></g><g transform="translate(100.07757568359375 154.75) rotate(0 159.92242431640625 56.25)"><text x="159.92242431640625" y="13.215" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">kill switch</text><text x="159.92242431640625" y="31.965" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">turns the AI path off, in minutes</text><text x="159.92242431640625" y="50.715" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">no redeploy</text><text x="159.92242431640625" y="69.465" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">falls back to: the old non-AI flow, a cached</text><text x="159.92242431640625" y="88.215" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">answer, or "temporarily unavailable"</text><text x="159.92242431640625" y="106.965" font-family="Excalifont, Xiaolai, Segoe UI Emoji" font-size="15px" fill="#1e1e1e" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">use for any incident</text></g><g stroke-opacity="0.45" fill-opacity="0.45" stroke-linecap="round" transform="translate(510 106) rotate(0 220 105)"><path d="M32 0 C114.82 1.99, 202.42 2.15, 408 0 C426.2 -1.37, 440.58 11, 440 32 C438.82 68.79, 439.59 101.62, 440 178 C441.88 195.98, 426.76 206.72, 408 210 C269.9 211.08, 138.04 209.81, 32 210 C11.33 211.23, 3.5 202.54, 0 178 C-1.88 126.65, -5.84 75, 0 32 C-1.71 12.1, 10.83 3.23, 32 0" stroke="none" stroke-width="0" fill="#ffd8a8"></path><